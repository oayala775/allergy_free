name: allergy_free
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.0.0
  multi_select_flutter: ^4.1.3
  dotted_border: ^3.1.0
  flutter_riverpod: ^3.0.0
  camera: ^0.10.5
  permission_handler: ^11.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  google_mlkit_text_recognition: ^0.11.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon/
    - assets/images/logo/
    - assets/images/avatar/

fonts:
  - family: Inter
    fonts:
    - asset: fonts/Inter-font.ttf
    - asset: fonts/Inter-italic.ttf